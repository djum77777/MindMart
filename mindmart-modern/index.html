<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mind Mart Modern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a bright corner shop. An opening scene rolls a cart through the doors, then three
   shelves in three colours (Minds, Skills, Apps) on a butter wall, with a red cart that fills up.
   Pictures carry the page; words appear on the shelf tags and in a label card on hover.
   The basket on the left fills up as you shop. Single light theme. */
:root{
  color-scheme: light;
  --wall:#ffe55c;       /* lemon wall, top */
  --wall2:#ffb42e;      /* mango wall, bottom */
  --accent:#ff3d24;     /* tomato: actions and the cart */
  --sun:#ffc022;        /* power, stars, stripes */
  --teal:#00b8a0;
  --pink:#ff4f9a;
  --violet:#6a3dff;
  --added:#17a862;      /* in the cart */
  --glass:#ffe1d8;      /* shelf top (each shelf overrides) */
  --lip:#ff8266;        /* shelf front (each shelf overrides) */
  --ink:#1f1235;        /* text */
  --dim:#5b4869;        /* secondary text */
  --line:#ecd9bd;       /* borders */
  --white:#ffffff;
  --display:"Archivo Black","Arial Black",Impact,sans-serif;
  --round:"Fredoka","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--wall);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
svg.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{display:grid;grid-template-columns:280px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100%}

/* top bar */
.bar{grid-column:1/-1;display:flex;align-items:center;gap:16px;background:var(--white);border-bottom:1px solid var(--line);padding:10px 20px}
.mark{font-weight:800;font-size:21px;letter-spacing:-.02em;color:var(--accent)}
.mark span{color:var(--ink)}
.steps{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:7px;padding:5px 12px 5px 5px;border-radius:99px;border:1px solid var(--line);color:var(--dim);font-size:13px;font-weight:600}
.step .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--wall)}
.step[aria-current="step"]{color:var(--ink);border-color:var(--ink)}
.step[aria-current="step"] .n{background:var(--ink);color:#fff}
.step.ok .n{background:var(--accent);color:#fff}
.step[disabled]{cursor:default;opacity:.55}
.total svg{color:var(--sun)}
.total{display:flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border-radius:99px;padding:6px 6px 6px 12px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.total b{background:#fff;color:var(--accent);border-radius:99px;min-width:24px;height:24px;display:grid;place-items:center;font-size:12px;padding:0 6px}

/* basket */
.basket{background:var(--white);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:16px;padding:18px;overflow-y:auto}
.cart{position:relative;height:176px;margin:0 -4px}
.cart .load{position:absolute;left:22px;right:22px;bottom:22px;display:flex;align-items:flex-end;justify-content:center}
.cart .load .pk{font-size:7.5px;margin-left:var(--ov,-6px);transform:rotate(var(--r,0deg));transform-origin:50% 100%}
.cart .load .pk:first-child{margin-left:0}
.cart .load .figure{font-size:11px}
.cart .mesh{position:absolute;left:0;right:0;bottom:0;height:70px;clip-path:polygon(0 0,100% 0,91% 100%,9% 100%);border-top:9px solid var(--accent);
  background:repeating-linear-gradient(90deg,rgba(255,61,36,.95) 0 1.5px,transparent 1.5px 16px),repeating-linear-gradient(0deg,rgba(255,61,36,.95) 0 1.5px,transparent 1.5px 16px),rgba(216,203,255,.18)}
.cart .handle{position:absolute;left:18%;right:18%;bottom:64px;height:46px;border:5px solid var(--accent);border-bottom:0;border-radius:60px 60px 0 0;opacity:.35}
.who h3{font-size:19px;font-weight:800;line-height:1.15}
.who p{color:var(--dim);font-size:13px;margin-top:2px}
.meter{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.meter i{height:12px;border-radius:3px;background:#f1ecf7;transition:background .35s}
.meter i.on{background:linear-gradient(180deg,#ffc94d,var(--sun))}
.level{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;font-weight:800;font-size:14px}
.level span{font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{position:relative;aspect-ratio:1;border-radius:10px;background:#f6f1ff;display:grid;place-items:center}
.tile .pk{font-size:5.4px}
.tile.empty{background:none;border:1.5px dashed var(--line)}
.tile button{position:absolute;right:-5px;top:-5px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:11px;opacity:0;transition:opacity .15s}
.tile:hover button,.tile button:focus-visible{opacity:1}
@media (hover:none){.tile button{opacity:1}}
.cta{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.btn{box-shadow:0 6px 16px rgba(201,61,34,0);display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;font-weight:800;border-radius:99px;padding:11px 18px;white-space:nowrap;transition:filter .12s,transform .12s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{background:#f1ecf7;color:var(--dim);cursor:not-allowed;filter:none;font-weight:600;box-shadow:none}
.btn.ghost{box-shadow:none;background:var(--white);color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.ghost:hover{border-color:var(--dim);filter:none}
.btn.sm{padding:7px 14px;font-size:13.5px}

/* aisle */
.aisle{overflow-y:auto;min-width:0;background:radial-gradient(60% 50% at 85% 0,rgba(255,255,255,.9),transparent 70%),radial-gradient(50% 40% at 0 100%,rgba(255,176,32,.22),transparent 70%),linear-gradient(180deg,var(--wall),var(--wall2))}
.ask{padding:20px 24px 4px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.ask h1{font-size:clamp(24px,3vw,34px);font-weight:800;letter-spacing:-.02em;line-height:1.1;text-wrap:balance;margin-right:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--white);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-weight:600}
.chip:hover{border-color:var(--dim)}
.find{display:inline-flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--line);border-radius:99px;padding:0 14px;color:var(--dim)}
.find:focus-within{border-color:var(--accent)}
.find input{border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--ink);padding:7px 0;width:170px}
.nohit{color:var(--dim);padding:40px 0 70px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

.shelf{padding-top:12px;transition:opacity .4s,filter .4s}
.shelf.off{opacity:.6;pointer-events:none}
.shelf header{display:flex;gap:10px;align-items:baseline;padding:0 24px;min-height:22px}
.shelf header b{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800}
.shelf header small{font-size:11px;color:var(--dim)}
.shelf header em{font-style:normal;font-size:13px;color:var(--dim);margin-left:auto;text-align:right}
.shelf header em b{font-size:13px;letter-spacing:0;text-transform:none;color:var(--ink)}
.rack{display:flex;gap:26px;overflow-x:auto;padding:0 34px;scrollbar-width:none;scroll-behavior:smooth;
  background:linear-gradient(180deg,transparent calc(100% - 50px),rgba(43,27,61,.10) calc(100% - 50px),var(--glass) calc(100% - 46px),var(--glass) calc(100% - 36px),var(--lip) calc(100% - 36px),var(--lip) calc(100% - 4px),rgba(43,27,61,.16) calc(100% - 4px),transparent)}
.rack::-webkit-scrollbar{display:none}
.rackwrap{position:relative}
.nav{position:absolute;top:calc(50% - 44px);width:40px;height:40px;border-radius:50%;background:var(--white);color:var(--accent);box-shadow:0 4px 14px rgba(27,22,64,.25);display:grid;place-items:center;font-size:20px;z-index:2;transition:transform .15s}
.nav:hover{transform:scale(1.1)}
.nav.prev{left:8px}.nav.next{right:8px}
.nav[hidden]{display:none}
.item{flex:none;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.stand{position:relative;display:flex;align-items:flex-end;justify-content:center;height:var(--sh,150px);transition:transform .35s cubic-bezier(.2,.9,.3,1.4)}
.item.spot .stand{transform:translateY(-10px) rotate(-2deg)}
.item[data-item^="mind"] .stand::before{content:"";position:absolute;inset:8% 0 0;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.95),transparent);opacity:0;transition:opacity .35s}
.item.spot .stand::before,.item.in .stand::before,.item:hover .stand::before{opacity:1}
.item:hover .stand{transform:translateY(-6px)}
.item.in .stand{transform:translateY(-4px)}
.lipzone{height:50px;display:flex;align-items:center;justify-content:center;padding-top:12px}
.tag{background:var(--white);border-radius:4px;padding:2px 8px;font-size:12px;font-weight:800;box-shadow:0 1px 2px rgba(0,0,0,.18);white-space:nowrap;font-variant-numeric:tabular-nums}
.item.in .tag{background:var(--accent);color:#fff}
.plus{position:absolute;right:-12px;bottom:10px;width:30px;height:30px;border-radius:50%;background:var(--white);box-shadow:0 2px 6px rgba(0,0,0,.28);display:grid;place-items:center;font-size:16px;transition:transform .15s,background .15s}
.item:hover .plus{transform:scale(1.12)}
.plus[aria-pressed="true"]{background:var(--accent);color:#fff}
.match{position:absolute;left:-10px;top:4px;width:26px;height:26px;border-radius:50%;background:var(--sun);color:#3a2400;display:grid;place-items:center;font-size:14px;transform:rotate(-10deg);box-shadow:0 1px 2px rgba(0,0,0,.2);z-index:1}
.match svg{fill:currentColor;stroke:none}

/* label card shown on hover or focus */
.tip{position:fixed;z-index:8;width:240px;background:var(--white);border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(27,22,64,.22);pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity .15s,transform .15s}
.tip.on{opacity:1;transform:none}
.tip b{display:block;font-weight:800;line-height:1.2}
.tip p{font-size:13px;color:var(--dim);margin-top:4px}
.tip small{display:inline-block;margin-top:8px;font-size:11px;font-weight:800;color:var(--accent)}

/* ---------- characters and drawn packaging (sizes in em, so the same markup works as a thumbnail) ---------- */
.pk{--h:#2f6fd6;position:relative;color:#fff;flex:none;font-size:16px;filter:drop-shadow(0 .35em .25em rgba(0,0,0,.22))}
.pk svg.ic{stroke-width:2.2}
.figure{width:9.2em;height:10.4em;display:flex;align-items:flex-end;justify-content:center}
.figure img{display:block;max-width:100%;max-height:100%}
.can{width:5.6em;height:7.4em;border-radius:.45em;background:linear-gradient(90deg,#8d9693,#f4f6f5 26%,#cfd5d2 62%,#868f8c)}
.can::before,.can::after{content:"";position:absolute;left:0;right:0;height:.28em;background:rgba(0,0,0,.14)}
.can::before{top:.45em}.can::after{bottom:.45em}
.can .lab{position:absolute;inset:.95em 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25em;text-align:center;padding:0 .3em;color:var(--ink);border-top:.4em solid var(--h);border-bottom:.4em solid var(--h);
  background:linear-gradient(90deg,rgba(0,0,0,.2),transparent 22%,rgba(255,255,255,.5) 44%,transparent 68%,rgba(0,0,0,.22)),#fbf8ef}
.can img{width:2.5em;height:2.5em;object-fit:contain}
.can b{font-family:var(--display);font-weight:400;font-size:.6em;line-height:1.05;text-transform:uppercase}
.pouch{width:6em;height:7.6em;border-radius:.3em .3em 1em 1em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3em;text-align:center;padding:1em .4em .4em;
  background:linear-gradient(100deg,color-mix(in srgb,var(--h) 70%,#000),var(--h) 35%,color-mix(in srgb,var(--h) 78%,#fff) 52%,var(--h) 72%,color-mix(in srgb,var(--h) 75%,#000))}
.pouch::before{content:"";position:absolute;left:0;right:0;top:0;height:.8em;border-radius:.3em .3em 0 0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 .12em,rgba(255,255,255,.12) .12em .3em)}
.pouch i{font-size:1.9em;display:grid;background:rgba(255,255,255,.18);border-radius:50%;padding:.22em}
.pouch .pic{background:#fff;padding:.3em}
.pouch .pic img{width:1em;height:1em;object-fit:contain;display:block}
.pouch b{font-family:var(--display);font-weight:400;font-size:.58em;line-height:1.05;text-transform:uppercase}

/* summary sheet */
.sheet{position:fixed;inset:0;z-index:7;background:rgba(27,22,64,.45);display:grid;place-items:center;padding:16px;overflow-y:auto}
.sheet[hidden]{display:none}
.card{background:var(--white);border-radius:24px;max-width:680px;width:100%;display:grid;grid-template-columns:220px minmax(0,1fr);overflow:hidden;box-shadow:0 30px 80px rgba(27,22,64,.35)}
.card .face{background:radial-gradient(90% 70% at 50% 30%,#fff,transparent 70%),linear-gradient(180deg,var(--wall),var(--wall2));display:grid;place-items:end center;padding:20px 16px 0}
.card .face img{width:100%;height:auto;display:block}
.card .sum{padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.card h2+p{color:var(--dim);font-size:14px;margin-top:-8px}
.card h3{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--dim);display:flex;justify-content:space-between;margin-bottom:6px}
.cando{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:min(46vh,330px);overflow-y:auto}
.cando li{display:flex;gap:10px;align-items:center;font-size:13.5px;line-height:1.3;color:var(--dim)}
.cando b{display:block;color:var(--ink);font-weight:800}
.cando .th{width:36px;height:36px;border-radius:10px;background:#f6f1ff;display:grid;place-items:center;flex:none}
.cando .th img{max-width:26px;max-height:28px}
.cando .th i{width:26px;height:26px;border-radius:50%;background:var(--h);color:#fff;display:grid;place-items:center;font-size:15px}
.able{list-style:none;margin:0;padding:0 4px 0 0;display:flex;flex-direction:column;gap:10px;max-height:min(48vh,340px);overflow-y:auto}
.able .top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;margin-bottom:4px}
.able .top b{font-weight:800}
.able .top span{font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
.able .meter i{height:10px}
.able p{font-size:12px;color:var(--dim);margin-top:3px}
.able .top em{font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:1px 7px;margin-left:8px;vertical-align:1px}
.tile.side{outline:2px dashed #cdb48a;outline-offset:-2px;background:#fff}
.seg{display:inline-flex;gap:0}
.seg .chip:first-child{border-radius:99px 0 0 99px}
.seg .chip:last-child{border-radius:0 99px 99px 0;margin-left:-2px}
.nofit{font-size:13.5px;color:var(--dim)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:6;background:var(--ink);color:#fff;border-radius:16px;padding:12px 12px 12px 18px;display:flex;align-items:center;gap:14px;max-width:min(560px,calc(100vw - 32px));font-size:14px;line-height:1.35;box-shadow:0 14px 34px rgba(43,27,61,.35)}
.toast[hidden]{display:none}
.toast .btn{box-shadow:none;border:0;flex:none}
.able{scrollbar-width:thin;scrollbar-color:#e6d6bf transparent}
.boost{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--dim)}
.boost .chip{padding:3px 10px;font-size:12.5px;border-width:1.5px;color:var(--ink)}
.boost .chip svg{color:var(--accent)}
.more{flex:none;align-self:center;margin-bottom:56px;width:170px;min-height:104px;border:2px dashed var(--ink);border-radius:16px;background:rgba(255,255,255,.85);padding:12px;display:flex;flex-direction:column;justify-content:center;gap:6px;text-align:left;font-size:13px;line-height:1.25}
.more span{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:800}
.more:hover{background:#fff;border-color:var(--accent)}
.hint{font-size:13px;color:var(--dim);margin-top:8px}
.picks{display:flex;gap:10px;flex-wrap:wrap}
.pick{width:64px;text-align:center;font-size:11px;font-weight:600;line-height:1.15}
.pick .pk{font-size:6.5px;margin:0 auto 5px}
.pick.none{width:auto;color:var(--dim);font-size:13px;font-weight:400;text-align:left}
@media (max-width:600px){.card{grid-template-columns:1fr}.card .face{padding:12px 30% 0}}

/* awake */
.finish{padding:10px 24px 28px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:30px;align-items:end}
.plinth{position:relative;width:280px;padding:26px 24px 0;border-radius:18px 18px 0 0;background:radial-gradient(120% 90% at 50% 0,#fff,rgba(255,255,255,0) 70%)}
.plinth img{display:block;width:100%;height:auto;position:relative;z-index:1}
.plinth span{display:block;height:34px;margin:-18px -24px 0;border-radius:50%/100% 100% 0 0;background:linear-gradient(180deg,var(--glass),var(--lip));box-shadow:0 10px 0 var(--lip),0 14px 12px rgba(0,0,0,.12)}
.bag{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;padding:0 12px 14px;border-bottom:10px solid var(--lip);box-shadow:0 -4px 0 var(--glass) inset;margin-bottom:18px;min-height:40px}
details{margin-top:14px}
summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--dim)}
pre{margin:8px 0 0;background:var(--ink);border-radius:12px;padding:14px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;overflow-x:auto;color:#ece8ff}

.fly{position:fixed;left:0;top:0;z-index:9;pointer-events:none;transform-origin:0 0}

/* ===== lively theme ===== */
h1,.who h3,.card h2,.mark,.btn,.chip,.step,.tag,.shelf header b{font-family:var(--round)}
.bar{border-bottom:0;box-shadow:0 4px 0 var(--ink);position:relative;z-index:1}
.mark{font-size:25px;font-weight:700;color:var(--accent)}
.mark span{color:var(--violet)}
.step[aria-current="step"]{border-color:var(--accent)}
.step[aria-current="step"] .n{background:var(--accent)}
.step.ok .n{background:var(--added)}
.total{background:var(--ink)}
.replay{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--dim);font-size:16px}
.replay[aria-pressed="false"]{color:var(--accent)}
.replay:hover{color:var(--accent);border-color:var(--accent)}
.aisle{background:radial-gradient(rgba(255,255,255,.6) 2.5px,transparent 3px) 0 0/28px 28px,linear-gradient(180deg,var(--wall),var(--wall2))}
.ask{position:relative;padding-top:44px}
.ask::before{content:"";position:absolute;left:0;right:0;top:0;height:22px;border-top:3px solid var(--ink);
  background:conic-gradient(from -45deg at 50% 100%,var(--accent) 90deg,#0000 0) 0 0/200px 22px,conic-gradient(from -45deg at 50% 100%,var(--sun) 90deg,#0000 0) 40px 0/200px 22px,conic-gradient(from -45deg at 50% 100%,var(--teal) 90deg,#0000 0) 80px 0/200px 22px,conic-gradient(from -45deg at 50% 100%,var(--pink) 90deg,#0000 0) 120px 0/200px 22px,conic-gradient(from -45deg at 50% 100%,var(--violet) 90deg,#0000 0) 160px 0/200px 22px}
.ask h1{font-weight:700;font-size:clamp(26px,3.2vw,38px)}
.chip{font-weight:600;border-width:2px}
.chip[aria-pressed="true"]{background:var(--violet);border-color:var(--violet)}
.chip:nth-child(6n+2) svg{color:var(--accent)}.chip:nth-child(6n+3) svg{color:var(--teal)}.chip:nth-child(6n+4) svg{color:var(--violet)}.chip:nth-child(6n+5) svg{color:#e79a00}.chip:nth-child(6n+6) svg{color:var(--pink)}
.chip[aria-pressed="true"] svg{color:#fff}
#shelf1{--glass:#ffd2c9;--lip:#ff4b3a;--sign:#e62a14}
#shelf2{--glass:#ddd2ff;--lip:#7a52ff;--sign:#5a2fe6}
#shelf3{--glass:#c4f6ec;--lip:#00b8a0;--sign:#008a78}
.shelf header{align-items:center;margin-bottom:4px}
.shelf header b{background:var(--sign);color:#fff;padding:4px 14px;border-radius:99px;font-size:12px;letter-spacing:.06em;font-weight:600;box-shadow:0 3px 0 rgba(43,27,61,.18)}
.shelf header small{font-weight:800;color:var(--sign)}
.item[data-item^="mind"] .stand::before{inset:20% 4% 2%;border-radius:50%;background:var(--spot,#ffd1dc);opacity:1;transition:transform .35s}
.item[data-item^="mind"]:nth-child(6n+1){--spot:#ff8fb8}.item[data-item^="mind"]:nth-child(6n+2){--spot:#ffffff}.item[data-item^="mind"]:nth-child(6n+3){--spot:#6fe3cf}.item[data-item^="mind"]:nth-child(6n+4){--spot:#b39bff}.item[data-item^="mind"]:nth-child(6n+5){--spot:#ff9a5c}.item[data-item^="mind"]:nth-child(6n+6){--spot:#7cc4ff}
.item.spot .stand::before,.item:hover .stand::before,.item.in .stand::before{transform:scale(1.1)}
.tag{font-weight:600;font-size:12.5px;border-radius:6px;padding:2px 9px}
.item.in .tag{background:var(--added)}
.plus{color:var(--accent)}
.plus[aria-pressed="true"]{background:var(--added);color:#fff}
.nav{color:var(--accent)}
.basket{border-right:0;box-shadow:inset -4px 0 0 var(--ink);background:#fff}
.tile{background:#fff0b8}
.meter i{background:#f3e6cf}
.meter i.on{background:linear-gradient(180deg,#ffd21f,#ff8a00)}
.btn{background:var(--accent);border-radius:16px;box-shadow:0 5px 0 #b3200c;font-weight:600;font-size:16px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b3200c}
.btn.ghost{box-shadow:0 3px 0 var(--line);border-width:2px;font-size:14px}
.btn[disabled]{box-shadow:none;background:#f6ead8}
.who h3{font-weight:700;font-size:21px}
.card h2{font-weight:700}
.card .face{background:radial-gradient(90% 70% at 50% 30%,rgba(255,255,255,.9),transparent 70%),linear-gradient(180deg,#ffe55c,#ff8a3d)}
.cando .th{background:#fff1d6}
.tip small{color:var(--accent)}
.plinth{background:none}
.plinth::before{content:"";position:absolute;inset:-30px -30px 0;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.75) 0 12deg,transparent 12deg 24deg);opacity:.75;z-index:0;aspect-ratio:1;inset:-10px -30px auto;animation:spin 40s linear infinite}
.plinth span{background:linear-gradient(180deg,#ffd2c9,#ff4b3a);box-shadow:0 10px 0 #ff4b3a,0 14px 12px rgba(0,0,0,.15)}
.bag{border-bottom-color:#7a52ff;box-shadow:0 -4px 0 #ddd2ff inset}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scaleY(1.03) scaleX(.985)}}
.shelf:not(.off) .figure img,.cart .figure img,.plinth img{animation:breathe 3.4s ease-in-out infinite;transform-origin:50% 100%}
.item:nth-child(3n+2) .figure img{animation-delay:-1.1s}.item:nth-child(3n) .figure img{animation-delay:-2.3s}
.bit{position:fixed;left:0;top:0;width:9px;height:13px;border-radius:2px;z-index:10;pointer-events:none}

/* ===== opening scene ===== */
.intro{position:fixed;inset:0;z-index:20;overflow:hidden;background:radial-gradient(rgba(255,255,255,.6) 2.5px,transparent 3px) 0 0/28px 28px,linear-gradient(180deg,var(--wall),var(--wall2));transition:transform .7s cubic-bezier(.7,0,.2,1)}
.intro.bye{transform:translateY(-105%)}
.irow{position:absolute;left:0;right:0;height:26vh;display:flex;align-items:flex-end;border-bottom:18px solid var(--c);box-shadow:0 8px 0 rgba(43,27,61,.12)}
.irow:nth-child(1){top:1vh;--c:#ff4b3a}.irow:nth-child(2){top:31vh;--c:#7a52ff}.irow:nth-child(3){top:61vh;--c:#00b8a0}
.itrack{display:flex;align-items:flex-end;gap:26px;padding-right:26px;animation:roll 22s linear infinite;flex:none}
.irow:nth-child(2) .itrack{animation-direction:reverse;animation-duration:26s}
.itrack > img{height:21vh;width:auto;filter:drop-shadow(0 6px 4px rgba(0,0,0,.2))}
.itrack .pk{font-size:calc(21vh / 7.8)}
@keyframes roll{to{transform:translateX(-50%)}}
.aview{position:absolute;inset:0;animation:pushin 1.4s 1.3s cubic-bezier(.2,.7,.2,1) both}
@keyframes pushin{from{transform:scale(1.25)}to{transform:scale(1)}}
.front{position:absolute;inset:0;transform-origin:50% 62%;animation:enter 1.1s 1.5s cubic-bezier(.6,0,.9,.4) forwards}
@keyframes enter{80%{opacity:1}to{transform:scale(9);opacity:0;visibility:hidden}}
.hole{position:absolute;left:50%;bottom:14vh;width:min(48vw,440px);height:min(50vh,380px);transform:translateX(-50%);box-shadow:0 0 0 200vmax #ff5a3a;border-radius:16px 16px 0 0;overflow:hidden;outline:10px solid #fff;outline-offset:0}
.hole i{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(120deg,rgba(214,241,255,.96),rgba(170,220,250,.96));border:6px solid #fff;animation:slide 0.7s 0.8s cubic-bezier(.6,0,.3,1) forwards}
.hole i:first-child{left:0;--to:-102%}.hole i:last-child{right:0;--to:102%}
@keyframes slide{to{transform:translateX(var(--to))}}
.awning{position:absolute;left:0;right:0;top:0;height:13vh;background:repeating-linear-gradient(90deg,#fff 0 46px,#ff3d2e 46px 92px);-webkit-mask:radial-gradient(23px at 23px 100%,#0000 98%,#000) 0 0/46px 100%;mask:radial-gradient(23px at 23px 100%,#0000 98%,#000) 0 0/46px 100%;filter:drop-shadow(0 6px 0 rgba(43,27,61,.18))}
.sign{position:absolute;left:50%;top:15vh;transform:translateX(-50%) rotate(-2deg);background:var(--sun);color:var(--ink);font:700 clamp(30px,6vw,64px)/1 var(--round);padding:.25em .6em;border-radius:.4em;box-shadow:0 8px 0 #d98a00;white-space:nowrap;letter-spacing:.02em}
.sign span{color:var(--accent)}
.win{position:absolute;bottom:22vh;width:16vw;height:26vh;border-radius:14px;background:linear-gradient(160deg,#fff27a,#ffc21f);border:8px solid #fff;max-width:200px}
.win.l{left:6vw}.win.r{right:6vw}
.pave{position:absolute;left:0;right:0;bottom:0;height:14vh;background:#f3dfc4;border-top:8px solid #e2c9a6}
.trolley{position:absolute;left:50%;bottom:4vh;width:240px;height:186px;margin-left:-120px;animation:rollin 1.2s cubic-bezier(.2,.8,.3,1) both,jog .5s 1.2s ease-in-out infinite}
@keyframes rollin{from{transform:translateX(-75vw) rotate(-4deg)}}
@keyframes jog{50%{translate:0 -4px}}
.trolley svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hop{position:absolute;left:50%;bottom:60px;width:96px;margin-left:-48px;opacity:0;animation:hop .8s cubic-bezier(.3,.6,.4,1) forwards;animation-delay:var(--d)}
@keyframes hop{0%{opacity:1;transform:translate(var(--sx),-56vh) scale(1.2) rotate(-20deg)}55%{opacity:1;transform:translate(calc(var(--sx) * .35),-62vh) scale(1.1)}100%{opacity:1;transform:translate(var(--ex),0) scale(1) rotate(var(--rot))}}
.hook{position:absolute;left:0;right:0;top:9vh;text-align:center;animation:pop .6s 2.9s cubic-bezier(.2,1.6,.4,1) both;pointer-events:none}
.hook h2{display:inline-block;margin:0;background:#fff;color:var(--ink);font:700 clamp(28px,5vw,56px)/1.05 var(--round);padding:.35em .7em;border-radius:.5em;box-shadow:0 8px 0 var(--ink);rotate:-2deg}
.hook h2 em{font-style:normal;color:var(--accent)}
@keyframes pop{from{transform:scale(0);opacity:0}}
.intro.wait *{animation-play-state:paused!important}
.enter{position:absolute;left:50%;bottom:calc(14vh + min(25vh,190px) - 34px);transform:translateX(-50%);z-index:2;display:none;align-items:center;gap:10px;background:var(--accent);color:#fff;font:700 clamp(18px,2.4vw,26px) var(--round);padding:16px 28px;border-radius:20px;box-shadow:0 7px 0 #c93d22;white-space:nowrap}
.enter:active{transform:translateX(-50%) translateY(5px);box-shadow:0 2px 0 #c93d22}
.intro.wait .enter{display:inline-flex}
.skip{position:absolute;right:18px;bottom:18px;background:var(--ink);color:#fff;border-radius:99px;padding:8px 16px;font:600 14px var(--round);z-index:2}

/* ===== modern theme: neutral gallery wall, hairline shelves, black type, one blue accent.
   The characters and packaging carry all the colour. ===== */
:root{--wall:#f6f5f1;--wall2:#f6f5f1;--accent:#2a4bff;--sun:#111114;--teal:#111114;--pink:#111114;--violet:#111114;--added:#2a4bff;
  --glass:#fff;--lip:#fff;--ink:#111114;--dim:#74747b;--line:#e3e2dc;
  --round:"Geist","Helvetica Neue",Arial,sans-serif;--body:"Geist","Helvetica Neue",Arial,sans-serif}
body{background:var(--wall)}
.bar{box-shadow:0 1px 0 var(--line);padding:14px 28px}
.mark{font-weight:700;letter-spacing:-.04em;color:var(--ink);font-size:22px}
.mark span{color:var(--ink);font-weight:300}
.step{border:0;padding:4px 10px 4px 0;font-weight:500;background:none}
.step .n{background:none;border:1px solid #cfcec8;font-weight:600}
.step[aria-current="step"] .n,.step.ok .n{background:var(--ink);border-color:var(--ink);color:#fff}
.total{background:none;color:var(--ink);border:1px solid var(--line);font-weight:600}
.total svg{color:var(--ink)}
.total b{background:var(--ink);color:#fff}
.replay[aria-pressed="false"]{color:var(--dim)}
.replay:hover{color:var(--ink);border-color:var(--ink)}
.aisle{background:var(--wall)}
.ask{padding:34px 36px 8px}
.ask::before{display:none}
.ask h1{font-weight:600;letter-spacing:-.04em;font-size:clamp(28px,3.4vw,46px)}
.chip{border:1px solid var(--line);font-weight:500;background:#fff}
.chip svg{color:currentColor!important}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.seg .chip:last-child{margin-left:-1px}
.find:focus-within{border-color:var(--ink)}
#shelf1,#shelf2,#shelf3{--glass:#fff;--lip:#fff;--sign:var(--ink)}
.shelf{padding-top:20px}
.shelf.off{opacity:.45}
.shelf header{padding:0 36px}
.shelf header b{background:none;color:var(--ink);padding:0;box-shadow:none;font-weight:600;letter-spacing:.1em;font-size:11px}
.shelf header small{color:var(--dim);font-weight:500}
.rack{padding:0 46px;gap:30px;background:linear-gradient(180deg,transparent calc(100% - 50px),#fff calc(100% - 50px),#fff calc(100% - 44px),rgba(17,17,20,.09) calc(100% - 44px),transparent calc(100% - 30px))}
.tag{background:none!important;box-shadow:none;font-weight:500;font-size:12.5px;color:var(--ink);padding:0;border-radius:0}
.item.in .tag{color:var(--accent);font-weight:600}
.item[data-item^="mind"] .stand::before{background:#eae8e1;inset:26% 8% 3%}
.item.in[data-item^="mind"] .stand::before{background:#dbe2ff}
.plus{background:var(--ink);color:#fff;width:26px;height:26px;font-size:14px;box-shadow:none;right:-8px}
.plus[aria-pressed="true"]{background:var(--accent)}
.match{background:var(--ink);color:#fff;width:22px;height:22px;font-size:11px;transform:none;box-shadow:none}
.nav{box-shadow:0 2px 12px rgba(17,17,20,.14);color:var(--ink)}
.pk{filter:drop-shadow(0 .5em .45em rgba(17,17,20,.13))}
.basket{box-shadow:inset -1px 0 0 var(--line);background:#fff;padding:22px}
.cart .mesh{border-top:3px solid var(--ink);background:repeating-linear-gradient(90deg,rgba(17,17,20,.5) 0 1px,transparent 1px 16px),repeating-linear-gradient(0deg,rgba(17,17,20,.5) 0 1px,transparent 1px 16px)}
.cart .handle{border-color:var(--ink);border-width:3px;opacity:.22}
.who h3{font-weight:600;letter-spacing:-.03em}
.meter{gap:4px}
.meter i{background:#eae8e1;border-radius:2px;height:8px}
.meter i.on{background:var(--ink)}
.level{font-weight:600}
.able .top b{font-weight:600}
.able .top span{color:var(--ink);font-weight:600}
.tile{background:#f3f2ee;border-radius:12px}
.tile.side{background:#fff;outline-color:#cfcec8}
.btn{background:var(--ink);border-radius:99px;box-shadow:none;font-weight:600;font-size:15px}
.btn:hover{filter:none;background:#2b2b31}
.btn:active{transform:scale(.98);box-shadow:none}
.btn.ghost{box-shadow:none;border:1px solid var(--line);background:#fff}
.btn.ghost:hover{background:#fff;border-color:var(--ink)}
.btn[disabled]{background:#eae8e1}
.card{border-radius:22px}
.card .face{background:#f1f0eb}
.card h2{font-weight:600;letter-spacing:-.035em}
.cando .th{background:#f3f2ee}
.plinth::before{display:none}
.plinth span{background:#fff;box-shadow:0 10px 0 #eae8e1,0 16px 24px rgba(17,17,20,.08)}
.bag{border-bottom:1px solid var(--line);box-shadow:none}
.more{border:1px dashed #bdbcb6;background:#fff}
.more span{color:var(--ink)}
.tip{border-radius:14px;box-shadow:0 12px 34px rgba(17,17,20,.16)}
.tip small{color:var(--dim)}
.boost .chip svg{color:var(--ink)!important}
.bit{border-radius:50%;width:7px;height:7px}
.intro{background:var(--wall)}
.irow{border-bottom:2px solid var(--ink)!important;box-shadow:none}
.hole{box-shadow:0 0 0 200vmax #f6f5f1;outline:2px solid var(--ink);border-radius:4px 4px 0 0}
.hole i{background:linear-gradient(120deg,#eef2f7,#dde5ef);border:2px solid var(--ink)}
.awning{background:var(--ink);height:9vh;filter:none}
.sign{background:none;color:var(--ink);box-shadow:none;transform:translateX(-50%);font-weight:700;letter-spacing:-.05em;font-size:clamp(34px,7vw,84px)}
.sign span{color:var(--ink);font-weight:300}
.win{background:#fff;border:2px solid var(--ink);border-radius:4px}
.pave{background:#eae8e1;border-top:2px solid var(--ink)}
.hook h2{box-shadow:none;rotate:0deg;background:var(--ink);color:#fff;border-radius:18px;font-weight:600;letter-spacing:-.03em}
.hook h2 em{color:#9fb1ff}
.enter{background:var(--ink);box-shadow:none;border-radius:99px;font-weight:600}
.enter:active{box-shadow:none}

@media (max-width:820px){
  html,body{height:auto}
  .app{grid-template-columns:1fr;height:auto}
  .basket{border-right:0;border-top:1px solid var(--line);order:3}
  .aisle{overflow:visible}
  .bar{flex-wrap:wrap}
  .finish{grid-template-columns:1fr}
  .plinth{width:200px}
  .tiles{grid-template-columns:repeat(6,1fr)}
}
/* ===== phone: a compact top bar, swipeable chips, and the cart docked at the bottom ===== */
.dock{display:none}
@media (max-width:820px){
  .app{padding-bottom:78px}
  .bar{padding:10px 14px;gap:8px 8px}
  .mark{margin-right:auto}
  .steps{order:5;flex:0 0 100%;flex-wrap:nowrap}
  .step{flex:1;justify-content:center;font-size:12.5px;padding-right:8px}
  .ask{padding-left:16px;padding-right:16px}
  .ask h1{margin-right:0;flex:0 0 100%}
  .ask .row[role="group"]{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none;max-width:100vw}
  .ask .row[role="group"]::-webkit-scrollbar{display:none}
  .chip{flex:none}
  .find input{width:130px}
  .shelf header{padding:0 16px}
  .shelf header em{display:none}
  .rack{padding:0 22px;gap:20px}
  .win{display:none}
  .hole{width:64vw}
  .sign{top:17vh}
  .card .sum{padding:18px}
  .toast{bottom:92px}
  .dock{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:5;align-items:center;gap:10px;background:#fff;border-top:3px solid var(--ink);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
  .dock[hidden]{display:none}
  .dockcart{position:relative;width:48px;height:48px;border-radius:14px;background:var(--wall);display:grid;place-items:center;font-size:24px;flex:none;overflow:visible}
  .dockcart img{width:40px;height:40px;object-fit:contain}
  .dockcart b{position:absolute;right:-6px;top:-6px;min-width:20px;height:20px;border-radius:99px;background:var(--accent);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
  .dockwho{flex:1;min-width:0;line-height:1.15}
  .dockwho b{display:block;font-family:var(--round);font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dockwho span{font-size:12px;color:var(--dim);display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
  .dock .btn{padding:10px 14px;font-size:14px}
  .dock .btn.ghost{padding:9px 12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">

    <nav class="steps" id="steps" aria-label="Steps"></nav>
    <button class="replay" id="sound" aria-label="Sound" title="Sound on or off" aria-pressed="true"></button>
    <button class="replay" id="replay" aria-label="Replay the opening scene" title="Replay the opening scene"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 108-8H6M9 1L6 4l3 3"/></svg></button>
    <div class="total" id="total" aria-live="polite"></div>

  <aside class="basket" id="basket" aria-label="Your basket"></aside>

</div>

<script>

/* ---------- state ---------- */
const S={step:1,goal:'all',spot:0,mind:null,skills:[],apps:[],awake:false,review:false,touched:false,q:'',fitOnly:true};
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
let timer=null;
const mind=()=>S.mind&&byId(MINDS,S.mind);
const visible=()=>MINDS.filter(m=>S.goal==='all'||m.goal===S.goal||m.blank);
/* An item fits when it shares a topic with the Mind, or with an ability the Mind has gained from a fitting skill
   (one level only, so the shelf grows with the build without ending up matching everything). */
const core=(m,x)=>x.tags.some(t=>m.tags.includes(t));
const grown=m=>{const g=[];S.skills.forEach(id=>{const x=byId(SKILLS,id);if(core(m,x))x.tags.forEach(t=>{if(!g.includes(t))g.push(t)})});return g};
const fits=(m,x)=>{if(!m)return false;if(core(m,x))return true;const g=grown(m);return x.tags.some(t=>g.includes(t))};
const skillPts=id=>{const x=byId(SKILLS,id);return x.p+(fits(mind(),x)?4:0)};
const appPts=id=>fits(mind(),byId(APPS,id))?5:3;
function power(){const m=mind();if(!m)return 0;return Math.min(100,m.base+S.skills.reduce((t,id)=>t+skillPts(id),0)+S.apps.reduce((t,id)=>t+appPts(id),0))}
const levelName=p=>p===0?'Empty':p<45?'Spark':p<60?'Capable':p<80?'Strong':'Fully powered';
const hit=x=>!S.q||(x.name+' '+x.line).toLowerCase().includes(S.q.toLowerCase());
const inCart=x=>S.skills.includes(x.id)||S.apps.includes(x.id);
const anyFit=list=>list.some(x=>fits(mind(),x));
/* by default a shelf shows only what fits the chosen Mind (plus anything already in the cart); a search looks through everything */
const sortFor=list=>list.filter(hit).filter(x=>!S.fitOnly||S.q||!anyFit(list)||fits(mind(),x)||inCart(x)).sort((a,b)=>fits(mind(),b)-fits(mind(),a));
const count=()=>(S.mind?1:0)+S.skills.length+S.apps.length;

/* ---------- top bar ---------- */
function renderBar(){
  document.getElementById('steps').innerHTML=['Mind','Skills','Apps'].map((n,i)=>{
    const k=i+1,cur=!S.awake&&S.step===k,ok=S.awake||S.step>k,locked=(!S.mind&&k>1)||S.awake;
    return `<button class="step ${ok?'ok':''}" data-go="${k}" ${cur?'aria-current="step"':''} ${locked?'disabled':''}><span class="n">${ok?ic('check'):k}</span>${n}</button>`}).join('');

const rackSkills=()=>sortFor(SKILLS).map(x=>item('skill',x,{pk:pkSkill(x),on:S.skills.includes(x.id),match:fits(mind(),x),tag:`+${skillPts(x.id)}`})).join('')+seeAll(SKILLS,'skills')||nohit;
const rackApps=()=>sortFor(APPS).map(x=>item('app',x,{pk:pkApp(x),on:S.apps.includes(x.id),match:fits(mind(),x),tag:`+${appPts(x.id)}`})).join('')+seeAll(APPS,'apps')||nohit;

/* ability bars for the summary. Scores are illustrative: a Mind scores 5 in its own areas,
   each matching skill adds 2 and each matching app adds 1; a skill or app can also open a new area. */
const AB={org:'Scheduling and reminders',mail:'Inbox handling',travel:'Trip planning',sales:'Selling and deals',money:'Money tracking',data:'Number crunching',crypto:'On-chain trading',build:'Building and testing',design:'Design work',pm:'Project tracking',health:'Health and fitness',food:'Meals and nutrition',hr:'Hiring',events:'Events and fixtures',docs:'Docs and slides',content:'Content creation',video:'Video creation',social:'Social posting',research:'Research',learn:'Teaching and learning',web:'Web pages',chat:'Team chat',photos:'Photo sorting',pets:'Pet care',home:'Home and plants',fun:'Fun and fortunes'};
function abilities(){
  const m=mind(),rows={};
  const add=(tag,own,extra,src)=>{if(!AB[tag])return;const r=rows[tag];if(r){r.score+=extra;if(!r.src.includes(src))r.src.push(src)}else rows[tag]={tag,score:own,src:[src]}};
  m.tags.forEach(t=>add(t,5,0,m.name));
  S.skills.forEach(id=>{const x=byId(SKILLS,id);x.tags.forEach(t=>add(t,4,2,x.short))});
  S.apps.forEach(id=>{const x=byId(APPS,id);x.tags.forEach(t=>add(t,2,1,x.name))});
  return Object.values(rows).map(r=>Object.assign(r,{score:Math.min(10,r.score),side:!m.tags.includes(r.tag)&&!grown(m).includes(r.tag)})).sort((a,b)=>b.score-a.score).slice(0,6);
}
function renderSheet(){

    return c.length?`<div class="boost"><span>Boost with</span>${c.map(([k,x])=>`<button class="chip" data-boost-${k}="${x.id}">${ic('plus')}${x.short||x.name}</button>`).join('')}</div>`:''};

        <ul class="able">${rows.map(r=>`<li><div class="top"><b>${AB[r.tag]}${r.side?'<em>side</em>':''}</b><span>${r.score}/10</span></div>
          <div class="meter" role="img" aria-label="${AB[r.tag]}: ${r.score} out of 10">${Array.from({length:10},(_,i)=>`<i class="${i<r.score?'on':''}"></i>`).join('')}</div>
          <p>${r.src.join(' + ')}</p>${boost(r)}</li>`).join('')}</ul>
        ${S.skills.length||S.apps.length?'':'<p class="hint">No skills or apps yet. Add some to raise these bars.</p>'}</div>
      <div><h3><span>Power</span><span>${levelName(p)} · ${p}</span></h3><div class="meter">${Array.from({length:10},(_,i)=>`<i class="${i<on?'on':''}"></i>`).join('')}</div></div>
      <div class="row"><button class="btn" data-go="awake" id="confirm">${ic('bolt')}Awaken now</button><button class="btn ghost" data-go="back">Keep shopping</button></div>
    </div></div>`;
  document.getElementById('confirm').focus();
}

/* ---------- sound: everything is synthesised in the browser, there are no audio files ---------- */
let AC=null,OUT=null,MUSIC=null,muted=false;
try{muted=localStorage.getItem('mindmart-mute')==='1'}catch(_){}
function audio(){
  if(muted)return null;
  try{
    if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();OUT=AC.createGain();OUT.gain.value=.9;OUT.connect(AC.destination)}
    if(AC.state==='suspended')AC.resume();
    return AC;
  }catch(_){return null}
}
const hz=m=>440*Math.pow(2,(m-69)/12);
function tone(m,t,d,type,v,to,dest){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'triangle';o.frequency.setValueAtTime(hz(m),t);
  if(to!=null)o.frequency.exponentialRampToValueAtTime(hz(to),t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.12,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(dest||OUT);o.start(t);o.stop(t+d+.05);
}
function sfx(kind,n){
  if(!audio())return;const t=AC.currentTime+.01;
  if(kind==='mind'){tone(52,t,.2,'sine',.25,64);tone(79,t+.13,.12,'triangle',.14);tone(84,t+.24,.22,'triangle',.14)}
  else if(kind==='skill'||kind==='app'){               /* power-up: a rising sweep under a quick arpeggio, a step higher with each item */
    const base=(kind==='app'?67:60)+Math.min(n||0,10);
    tone(base-12,t,.42,'sawtooth',.05,base+12);
    [0,4,7,12].forEach((k,i)=>tone(base+k,t+i*.065,.13,'square',.06));
    tone(base+16,t+.27,.3,'triangle',.1);
  }
  else if(kind==='drop'){tone(69,t,.16,'sine',.12,57)}
  else if(kind==='awake'){[60,64,67,72,76].forEach((m,i)=>tone(m,t+i*.085,.2,'triangle',.13));[72,76,79,84].forEach(m=>tone(m,t+.48,1.1,'triangle',.09));tone(48,t+.48,1.1,'sine',.16)}
}
function music(){
  if(!audio())return;stopMusic();
  MUSIC=AC.createGain();MUSIC.gain.value=.8;MUSIC.connect(OUT);
  const t0=AC.currentTime+.05,step=.21;
  [72,76,79,76, 81,79,76,79, 84,null,81,79, 76,79,84,null, 86,84,81,84, 88].forEach((m,i)=>{if(m)tone(m,t0+i*step,.2,'triangle',.11,null,MUSIC)});
  [48,53,55,48,53,55].forEach((m,i)=>{tone(m,t0+i*4*step,.5,'sine',.16,null,MUSIC);tone(m+12,t0+i*4*step+2*step,.18,'square',.03,null,MUSIC)});
  for(let i=0;i<21;i+=2)tone(108,t0+i*step,.03,'square',.012,null,MUSIC);
  [72,76,79,84,88].forEach(m=>tone(m,t0+21*step,.9,'triangle',.07,null,MUSIC));tone(48,t0+21*step,.9,'sine',.16,null,MUSIC);
}
function stopMusic(){if(MUSIC&&AC){try{MUSIC.gain.setTargetAtTime(0,AC.currentTime,.05)}catch(_){ }MUSIC=null}}
function paintSound(){const b=document.getElementById('sound');b.innerHTML=ic(muted?'mute':'sound');b.setAttribute('aria-pressed',String(!muted))}

/* ---------- confetti ---------- */
const BITS=['#111114','#2a4bff','#c9c8c2','#111114','#2a4bff','#c9c8c2'];
function confetti(x,y,n,spread){
  if(calm||!document.body.animate)return;
  for(let i=0;i<n;i++){
    const b=document.createElement('i');b.className='bit';b.style.background=BITS[i%BITS.length];document.body.appendChild(b);
    const dx=(Math.random()-.5)*spread,dy=-Math.random()*spread*.7-20,r=(Math.random()-.5)*900;
    b.animate([{transform:`translate(${x}px,${y}px) rotate(0)`,opacity:1},{transform:`translate(${x+dx*.7}px,${y+dy}px) rotate(${r*.6}deg)`,opacity:1,offset:.45},{transform:`translate(${x+dx}px,${y+dy+spread*.9}px) rotate(${r}deg)`,opacity:0}],
      {duration:900+Math.random()*700,easing:'cubic-bezier(.2,.6,.4,1)'}).onfinish=()=>b.remove();
  }
}

/* ---------- fly to basket ---------- */
function fly(srcEl){
  if(calm||!srcEl||!document.body.animate)return;
  const a=srcEl.getBoundingClientRect(),ghost=srcEl.cloneNode(true);
  confetti(a.left+a.width/2,a.top+a.height/2,12,180);
  requestAnimationFrame(()=>{
    const phone=matchMedia('(max-width:820px)').matches,t=document.querySelector(phone?'#dock .dockcart':'#cart .mesh');if(!t)return;
    const b=t.getBoundingClientRect(),w=document.createElement('div');
    w.className='fly';w.appendChild(ghost);document.body.appendChild(w);
    const s=phone?.3:.45,bx=b.left+b.width/2-a.width*s/2,by=phone?b.top+b.height/2-a.height*s/2:b.top-a.height*s*.4;
    w.animate([
      {transform:`translate(${a.left}px,${a.top}px) scale(1) rotate(0)`,opacity:1},
      {transform:`translate(${(a.left+bx)/2}px,${Math.min(a.top,by)-90}px) scale(${(1+s)/2}) rotate(-14deg)`,opacity:1,offset:.55},
      {transform:`translate(${bx}px,${by}px) scale(${s}) rotate(0)`,opacity:.9}
    ],{duration:650,easing:'cubic-bezier(.3,.1,.2,1)'}).onfinish=()=>w.remove();
  });
}
function go(to){
  if(to==='reset')Object.assign(S,{step:1,goal:'all',spot:0,mind:null,skills:[],apps:[],awake:false,review:false,touched:false,q:'',fitOnly:true});
  else if(to==='review'){if(!S.mind)return;S.review=true;renderSheet();return}
  else if(to==='back'){S.review=false;renderSheet();return}
  else if(to==='awake'){if(!S.mind)return;S.review=false;S.awake=true;sfx('awake');setTimeout(()=>{confetti(innerWidth*.35,innerHeight*.35,50,520);confetti(innerWidth*.7,innerHeight*.3,50,520)},60)}
  else{const k=+to;if(k>1&&!S.mind)return;S.step=k;S.awake=false;S.q=''}
  render();
  const sh=document.getElementById('shelf'+S.step),aisle=document.getElementById('aisle');
  if(S.awake||S.step===1)aisle.scrollTop=0;
  else if(sh&&sh.offsetTop+sh.offsetHeight>aisle.scrollTop+aisle.clientHeight)aisle.scrollTop=sh.offsetTop+sh.offsetHeight-aisle.clientHeight+16;
}
function toggle(list,id,btn){
  const i=list.indexOf(id);
  if(i>=0){list.splice(i,1);sfx('drop');render(true);return}
  list.push(id);sfx(list===S.skills?'skill':'app',list.length);
  const isSkill=list===S.skills,x=byId(isSkill?SKILLS:APPS,id);
  if(!fits(mind(),x))toast(`<b>${x.short||x.name}</b> is outside ${mind().name}’s speciality. It still works, as a side ${isSkill?'skill':'app'} with a smaller boost.`,()=>{const k=list.indexOf(id);if(k>=0)list.splice(k,1);render(true)});else hideToast();fly(btn.closest('.stand').querySelector('.pk'));render(true);
}

document.addEventListener('click',e=>{
  if(e.target.closest('#intro'))return;
  let t=e.target.closest('button');
  if(t&&t.id==='replay'){playIntro(true);return}
  if(t&&t.id==='sound'){muted=!muted;try{localStorage.setItem('mindmart-mute',muted?'1':'0')}catch(_){ }if(muted)stopMusic();paintSound();if(!muted)sfx('mind');return}
  if(!t){const it=e.target.closest('.item');if(it)t=it.querySelector('.plus')}   /* clicking the item itself works like its + */
  if(!t||t.disabled)return;const d=t.dataset;
  if(d.nav){const r=t.parentElement.querySelector('.rack');if(r.id==='rack1'){S.touched=true;stopAuto()}r.scrollBy({left:+d.nav*r.clientWidth*.7,behavior:calm?'auto':'smooth'});return}
  if(d.fit){S.fitOnly=d.fit==='1';render();return}
  if('undo' in d){undoLast();return}
  if('peek' in d){document.getElementById('basket').scrollIntoView({behavior:calm?'auto':'smooth'});return}
  if(d.go)go(d.go);
  else if(d.goal){S.goal=d.goal;S.spot=0;S.touched=true;render();document.getElementById('rack1').scrollLeft=0}
  else if(d.addMind){
    S.touched=true;stopAuto();
    if(S.mind===d.addMind){S.mind=null;sfx('drop');render(true);return}
    sfx('mind');
    S.mind=d.addMind;S.spot=Math.max(0,visible().findIndex(m=>m.id===d.addMind));
    fly(t.closest('.stand').querySelector('.pk'));render(true);
  }
  else if(d.boostSkill||d.boostApp){const list=d.boostSkill?S.skills:S.apps,id=d.boostSkill||d.boostApp;if(!list.includes(id)){list.push(id);sfx(d.boostSkill?'skill':'app',list.length)}render(true)}
  else if(d.addSkill)toggle(S.skills,d.addSkill,t);
  else if(d.addApp)toggle(S.apps,d.addApp,t);
  else if(d.dropSkill){S.skills=S.skills.filter(x=>x!==d.dropSkill);sfx('drop');render(true)}
  else if(d.dropApp){S.apps=S.apps.filter(x=>x!==d.dropApp);sfx('drop');render(true)}
  else if('all' in d){SKILLS.filter(x=>fits(mind(),x)).forEach(x=>{if(!S.skills.includes(x.id))S.skills.push(x.id)});sfx('skill',S.skills.length);render(true)}
  else if('copy' in d){
    const ok=()=>{t.textContent='Copied';setTimeout(()=>{t.textContent='Copy order'},1600)};
    const pick=()=>{document.querySelector('details').open=true;const r=document.createRange();r.selectNodeContents(document.getElementById('payload'));const s=getSelection();s.removeAllRanges();s.addRange(r);t.textContent='Selected. Press copy'};
    try{navigator.clipboard.writeText(payload()).then(ok,pick)}catch(_){pick()}
  }
});
function point(e){
  const el=e.target.closest&&e.target.closest('.item');
  if(!el){hideTip();return}
  if(el.dataset.item.startsWith('mind:')&&S.step===1){const i=[...el.parentElement.children].indexOf(el);if(i!==S.spot||timer)spotlight(i,true)}
  showTip(el);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.review)go('back')});
document.getElementById('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')go('back')});
document.addEventListener('input',e=>{if(e.target.id!=='q')return;S.q=e.target.value;const r=document.getElementById(S.step===2?'rack2':'rack3');r.innerHTML=S.step===2?rackSkills():rackApps();r.scrollLeft=0;arrows()});
document.addEventListener('pointerover',point);
document.addEventListener('focusin',point);
document.addEventListener('scroll',()=>{hideTip();arrows()},true);
addEventListener('resize',arrows);
render();
paintSound();
playIntro(false);
</script>
</body>
</html>
